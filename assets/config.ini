; BelfastPet 配置文件。修改后重新启动程序生效。
; 以 ; 或 # 开头的行是注释。

[general]
skin=01-改造.png       ; 默认形象（assets/skins 里的文件名）；右键菜单里切换过之后以菜单选择为准
height=320            ; 默认显示高度（像素），宽度按比例缩放；小图最多放大 2 倍
                      ; 用鼠标滚轮或右键菜单「大小」调整后，以那个数值为准
mirror_left=1         ; 向左走时水平镜像（1 开 / 0 关）
walk_speed=40         ; 行走速度，像素/秒
sleep_after=180       ; 用户多少秒没有操作后进入睡觉状态
hide_on_fullscreen=1  ; 前台程序全屏时自动隐藏（1 开 / 0 关）
bubble_ms=3000        ; 台词气泡显示时长（毫秒）
start_x=-1            ; 初始横坐标；-1 表示屏幕右侧
idle_min_ms=4000      ; 待机时两次随机动作之间的最短间隔
idle_max_ms=12000     ; 最长间隔

; 各动作的帧率。数值越低 CPU 唤醒越少。
[fps]
idle=2
blink=8
walk=8
drag=4
fall=8
react=6
sleep=1
