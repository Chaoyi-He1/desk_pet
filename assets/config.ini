; azure_lane_pet 配置文件。修改后重新启动程序生效。
; 以 ; 或 # 开头的行是注释。右键菜单里改过的选项（形象、大小、自动说话、鼠标穿透）
; 保存在用户目录的 settings.ini，优先于这里的默认值。

[general]
ship=cheshire         ; 默认角色（assets/ships 下的文件夹名：belfast / cheshire / shinano / noshiro）
skin=Q版-08-童年        ; 默认形象（该角色 skins 文件夹里的文件或文件夹名）
height=320            ; 默认大小：立绘的高度（像素）；Q 版小人的身高是它的 80%
mirror_left=1         ; 向左走时水平镜像（1 开 / 0 关）
walk_speed=40         ; 行走速度，像素/秒
sleep_after=180       ; 多少秒没有键鼠操作后睡觉
hide_on_fullscreen=1  ; 前台程序全屏时自动隐藏（1 开 / 0 关）
bubble_ms=3000        ; 台词气泡最短显示时长（毫秒）；长台词会显示更久
chatter_minutes=20    ; 自动说话的间隔（分钟），0 为关闭
start_x=-1            ; 初始横坐标；-1 表示屏幕右侧
idle_min_ms=4000      ; 待机时两次随机动作之间的最短间隔
idle_max_ms=12000     ; 最长间隔

; 立绘形象各动作的帧率（Q 版动画使用它自己导出时的帧率）。数值越低 CPU 唤醒越少。
[fps]
idle=2
blink=8
walk=8
drag=4
fall=8
react=6
sleep=1
land=8
